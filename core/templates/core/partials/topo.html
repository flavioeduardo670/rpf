{% load static %}<header class="rpf-topo">
    <div class="rpf-topo__faixa">
        <span class="rpf-etiqueta">Painel da casa</span>
        <svg class="rpf-topo__brilho" viewBox="0 0 64 46" aria-hidden="true">
            <ellipse cx="32" cy="23" rx="29" ry="17" transform="rotate(24 32 23)" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M32 9C32.8 18 36 21.2 45 23C36 24.8 32.8 28 32 37C31.2 28 28 24.8 19 23C28 21.2 31.2 18 32 9Z" fill="currentColor"/>
        </svg>
    </div>

    <div class="rpf-topo__barra">
        <a class="rpf-marca" href="{% url 'home' %}">
            <img class="rpf-marca__logo" src="{% static 'core/boneco/marca-preto.svg' %}" alt="" width="590" height="452">
            <span class="rpf-marca__nome"><span class="rpf-marca__republica">República</span> Portão dos Fundos</span>
        </a>

        <button class="rpf-menu-toggle" type="button" aria-expanded="false" aria-controls="rpf-menu">Menu</button>

        <nav class="rpf-menu" id="rpf-menu" aria-label="Seções">
            <a class="rpf-menu__link" href="{% url 'home' %}"{% if secao_atual.variante == 'inicio' %} aria-current="page"{% endif %}>Início</a>
            {% for item in menu_secoes %}
            <a class="rpf-menu__link" href="{{ item.url }}"{% if item.ativo %} aria-current="page"{% endif %}>{{ item.rotulo }}</a>
            {% endfor %}
        </nav>

        {% if user.is_authenticated %}
        <a class="rpf-perfil" href="{% url 'perfil' %}"{% if secao_atual.variante == 'perfil' %} aria-current="page"{% endif %}>
            <span class="rpf-perfil__inicial" aria-hidden="true">{{ user.first_name|default:user.username|first|upper }}</span>
            <span class="rpf-perfil__nome"><span class="rpf-oculto">Meu perfil: </span>{{ user.first_name|default:user.username }}</span>
        </a>
        {% endif %}
    </div>
</header>
